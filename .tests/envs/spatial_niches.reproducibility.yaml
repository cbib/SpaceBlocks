# spatial_niches — FIXED test environment (SpaceBlocks .tests/).
# conda deps pinned to the exact versions in envs/spatial_niches_linux-64.lock so the
# release test is reproducible regardless of when it is run. pip deps cannot be
# read from a conda lock — pin them from `pip freeze` in the tested env for a
# fully-fixed test (or install from the committed .lock directly).
name: spatial_niches
channels:
  - conda-forge
dependencies:
  - python=3.10.20
  - anndata=0.11.4
  - scanpy=1.11.5
  - harmonypy=0.0.10
  - python-igraph=1.0.0
  - leidenalg=0.12.0
  - numpy=1.26.4
  - scipy=1.15.2
  - pandas=2.3.3
  - scikit-learn=1.7.2
  - matplotlib-base=3.10.9
  - umap-learn=0.5.12
  - h5py=3.16.0
  - pip
  - pip:
      - pybanksy>=1.3.4   # TODO: pin exact (pip freeze)
