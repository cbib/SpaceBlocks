name: visiumhd
channels:
  - conda-forge

dependencies:
  - python=3.10

  # ── Core single-cell stack ───────────────────────────────────────
  - anndata>=0.10
  - scanpy>=1.10
  - harmonypy==0.0.10
  - leidenalg>=0.8
  - squidpy>=1.4

  # ── Spatial data handling ────────────────────────────────────────
  - geopandas>=0.14
  - shapely>=2.0
  - pyproj

  # ── Numerical / scientific ───────────────────────────────────────
  - numpy>=1.24,<2
  - scipy>=1.10
  - pandas>=2.0
  - scikit-learn>=1.3

  # ── Imaging ─────────────────────────────────────────────────────
  - pillow>=10.0
  - tifffile>=2023.0

  # ── Visualisation ───────────────────────────────────────────────
  - matplotlib-base>=3.7
  - seaborn>=0.13

  # ── I/O ─────────────────────────────────────────────────────────
  - h5py>=3.8
  - pyarrow>=14.0

  # ── pip-only packages ───────────────────────────────────────────
  - pip
  - pip:
      - pyclustree>=0.4
      - pydeseq2>=0.4
      - geosketch>=1.3