# visiumhd — FIXED test environment (SpaceBlocks .tests/).
# conda deps pinned to the exact versions in envs/visiumhd_linux-64.lock so the
# release test is reproducible regardless of when it is run. pip deps cannot be
# read from a conda lock — pin them from `pip freeze` in the tested env for a
# fully-fixed test (or install from the committed .lock directly).
name: visiumhd
channels:
  - conda-forge
dependencies:
  - python=3.10.20
  - anndata=0.11.4
  - scanpy=1.11.5
  - harmonypy=0.0.10
  - leidenalg=0.11.0
  - squidpy=1.6.5
  - geopandas=1.1.3
  - shapely=2.1.2
  - pyproj=3.7.1
  - numpy=1.26.4
  - scipy=1.15.2
  - pandas=2.3.3
  - scikit-learn=1.7.2
  - pillow=12.0.0
  - tifffile=2025.5.10
  - matplotlib-base=3.10.9
  - seaborn=0.13.2
  - h5py=3.16.0
  - pyarrow=22.0.0
  - pip
  - pip:
      - pyclustree>=0.4   # TODO: pin exact (pip freeze)
      - pydeseq2>=0.4   # TODO: pin exact (pip freeze)
      - geosketch>=1.3   # TODO: pin exact (pip freeze)
