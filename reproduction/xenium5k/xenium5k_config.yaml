    runtime: 60
    threads: 4
  validate_input:
    mem_mb: 8000
    runtime: 60
    threads: 4
  qc_sweep:
    mem_mb: 8000
    runtime: 60
    threads: 4
  preprocess_umap:
    mem_mb: 8000
    runtime: 60
    threads: 4
  ingest_ref:
    mem_mb: 8000
    runtime: 60
    threads: 4
  leiden_analysis:
    mem_mb: 8000
    runtime: 60
    threads: 4
  pseudobulk_aggregate:
    mem_mb: 8000
    runtime: 60
    threads: 4
  pseudobulk_de:
    mem_mb: 8000
