# Ready-to-run config for the xenium5k public-data example (mode: decoupled).
# Build the contracts first (reproduction/xenium5k/format_xenium*.py),
# then point the Snakefile at this file. Resources are deliberately low (tiny test).
mode: decoupled
post_processing_outdir: /scratch/CBiB/soterino/reproduction/xenium5k/results
logdir: /scratch/CBiB/soterino/reproduction/xenium5k/logs
spaceranger_processing_outdir: /scratch/CBiB/soterino/reproduction/xenium5k/_unused
geojson_path: /scratch/CBiB/soterino/reproduction/xenium5k/_unused
contract_dir: reproduction/xenium5k/contracts
random_seed: 0
use_precomputed_clusters: true
precomputed_metadata_dir: 'reproduction/xenium5k/metadata'
core_samples: reproduction/xenium5k/contracts/core_samples.tsv
xenium5k:
  xenium_dir: /scratch/CBiB/soterino/reproduction/xenium5k/results/{sample}
  zarr_dir: ''
  qupath_pyramid_level: 3
  hires_pyramid_level: 3
  pixel_size_um: 0.2125
contract:
  sample_key: sample
  spatial_key: spatial
  require_region: false
  require_raw_counts: true
  mito_prefix:
  - MT-
  - mt-
per_sample_qc: ''
analysis:
  plot_dpi: 300
  min_counts: 1
  min_cells: 3
  min_genes: 100
  n_neighbors: 10
  n_pcs: 30
  de_n_genes: 25
  resolution_scan_min: 0.6
  resolution_scan_max: 0.8
  resolution_scan_step: 0.2
  min_cells_per_type: 15
  sketch_fraction: 0.25
  run_pseudobulk_de: true
  run_leiden_analysis: true
  analysis_levels:
  - by_region
  - by_celltype_region
  min_cells_per_pseudobulk: 10
  min_replicates: 3
  min_counts_per_pseudobulk: 1000
  padj_threshold: 0.05
  lfc_threshold: 0.25
  region_levels:
  - Region 1
  - Region 2
  - Region 3
  - Region 4
  region_colors:
    Region 1: '#440154'
    Region 2: '#31688e'
    Region 3: '#35b779'
    Region 4: '#fde725'
qc_sweep:
  ingest_enabled: true
  ingest_key: cell_type_ingest
  cell_id_key: cell_id
  dpi: 300
  thresholds:
    min_genes:
    - 50
    - 100
    - 200
    min_counts:
    - 1
    - 10
    - 50
    max_counts:
    - 3000
    - 5000
    max_pct_mt:
    - 10
    - 15
    - 20
cluster_annotations: reproduction/xenium5k/cluster_annotations_x5k_demo.tsv
snakemake_cell_markers: config/snakemake_cell_markers.tsv
external_annotation:
  enabled: false
  column: manual_celltype
  keep_unannotated: true
ingest_ref: '/scratch/CBiB/soterino/ingest_ref_data/bcc_and_normal_Garnier_PNAS_2024.h5ad'   # optional: annotated reference h5ad for scanpy ingest. For this skin/melanoma
                 # example, download one from https://spatial-skin-atlas.cellgeni.sanger.ac.uk/
                 # and set ingest_ref_label_key to its cell-type column.
ingest_ref_label_key: 04_celltypes
integration:
  integrate_key: sample
extra_annotations:
  columns: []
spatial_niches:
  enabled: true
  use_precomputed: false
  niche_dir: ''
  lambda: 0.8
  num_neighbours: 18
  cluster_n_neighbours: 15
  n_iterations: 2
  max_m: 1
  nbr_weight_decay: scaled_gaussian
  use_hvg: true
  n_top_genes: 2000
  niche_resolution: 0.3
  refine: false
  refine_num_neigh: 6
  refine_iterations: 1
  refine_auto: false
  compute_umap: false
# Demo subcompartment: re-cluster the melanoma populations (subcluster rule).
subcompartments:
  Melanoma:
    strings:
    - Melanoma
    - Melanoma (proliferating)
    - Melanoma (neural-like)
    resolution_min: 0.2
    resolution_max: 0.6
    resolution_step: 0.2
gene_exploration:
  queries: reproduction/xenium5k/gene_queries_demo.tsv
  aucell_max_rank_fraction: 0.05
  niche_column: spatial_niche
  dpi: 300
sample_colors: {}
annotation_colors:
  cell_type_tsv:
    Melanoma: '#d62728'
    Melanoma (proliferating): '#8c564b'
    Melanoma (neural-like): '#a0522d'
    Keratinocytes: '#ffbb78'
    Fibroblasts: '#2ca02c'
    Macrophages: '#08519c'
resources:
  spaceranger_count_vhd:
    mem_mb: 8000
    runtime: 60
    threads: 4
  generate_qupath_vhd:
    mem_mb: 8000
    runtime: 60
    threads: 4
  prepare_input_vhd:
    mem_mb: 8000
    runtime: 60
    threads: 4
  convert_zarr_x5k:
    mem_mb: 8000
    runtime: 60
    threads: 4
  generate_qupath_x5k:
    mem_mb: 8000
    runtime: 60
    threads: 4
  prepare_input_x5k:
