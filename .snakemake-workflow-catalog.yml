# Configuration for the Snakemake Workflow Catalog
# https://snakemake.github.io/snakemake-workflow-catalog

usage:
  mandatory-flags:
    desc: >
      Configure config/config.yaml and the required sample sheets before
      execution. Space Ranger must be installed separately when required.
    flags: []

  software-stack-deployment:
    conda: true
    apptainer: false
    apptainer+conda: false
    report: false
