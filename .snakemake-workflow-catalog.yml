# Configuration for the Snakemake Workflow Catalog
# https://snakemake.github.io/snakemake-workflow-catalog

usage:
  mandatory-flags:
    desc: >
      Copy config/config.yaml.template to config/config.yaml, then configure it
      and the required sample sheets. Space Ranger must be installed separately
      when required.
    flags: []

  software-stack-deployment:
    conda: true
    apptainer: false
    apptainer+conda: false
    report: false
