name: spatial_niches
channels:
  - conda-forge
dependencies:
  - python=3.10

  # ── Core single-cell stack ───────────────────────────────────────
  - anndata>=0.10
  - scanpy>=1.10
  - harmonypy==0.0.10          # batch correction on the BANKSY PCA
  - python-igraph>=0.10
  - leidenalg>=0.8

  # ── Numerical / scientific ───────────────────────────────────────
  - numpy>=1.24,<2
  - scipy>=1.10
  - pandas>=2.0
  - scikit-learn>=1.3

  # ── Visualisation / I/O ──────────────────────────────────────────
  - matplotlib-base>=3.7
  - umap-learn>=0.5
  - h5py>=3.8

  # ── pip-only packages ───────────────────────────────────────────
  - pip
  - pip:
      - pybanksy>=1.3.4
