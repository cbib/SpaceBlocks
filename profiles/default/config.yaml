# ═══════════════════════════════════════════════════════════════════════════
#  Snakemake execution profile – local
# ═══════════════════════════════════════════════════════════════════════════
# Invoke with:  snakemake --profile profiles/default
# Set as default for a shell session with:  export SNAKEMAKE_PROFILE=profiles/default
executor: local
jobs: 4

# Robustness
keep-going: true
retries: 3                  # resubmit a failed job up to 3x; mem grows per attempt
rerun-incomplete: true
latency-wait: 60            # seconds to wait for NFS-lagged output files

# Scheduling
scheduler: greedy

# Software deployment
use-conda: true

# Verbosity – useful for debugging
printshellcmds: true

# Global resource caps (shared across all concurrent jobs)
resources:
  mem_mb: 16000
  cpus: 4
