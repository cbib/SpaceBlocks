name: tests

on:
  push:
    branches: [main]
    paths:
      - "workflow/**"
      - "config/**"
      - ".test/**"
      - "profiles/**"
      - ".snakemake-workflow-catalog.yml"
      - ".github/workflows/tests.yml"
  pull_request:
    paths:
      - "workflow/**"
      - "config/**"
      - ".test/**"
      - "profiles/**"
      - ".snakemake-workflow-catalog.yml"
      - ".github/workflows/tests.yml"
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-dryrun:
    # Fast smoke test: lints the workflow and builds the full DAG on a tiny synthetic
    # decoupled dataset (.tests/integration). No Conda envs or Space Ranger needed — a
    # dry-run validates the graph and (via the Snakefile) the config against the schema.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install validation dependencies
        run: pip install snakemake pandas jsonschema
        # Pin to the committed .tests fixture so editing the shipped default config
        # (or an example config pointing at generated paths) cannot break CI.
      - name: Lint workflow
        run: snakemake -s workflow/Snakefile -d .test --lint --workflow-profile none
      - name: Dry-run (decoupled smoke test)
        run: snakemake -s workflow/Snakefile -d .test --dry-run --workflow-profile none
  