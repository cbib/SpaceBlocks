$schema: "https://json-schema.org/draft/2020-12/schema"
description: Configuration schema for the SpaceBlocks spatial-transcriptomics workflow
type: object
# Strict: unknown top-level keys are rejected (catches typos). The Snakefile injects
# `contract.unfiltered_h5ad` and top-level `outdir` AFTER validation, so those two are
# intentionally absent here.
additionalProperties: false

required:
- snakemake_cell_markers
- geojson_path
- spaceranger_processing_outdir
- post_processing_outdir
- logdir
- resources
properties:
  samples:
    type: string
    description: Path to the Visium HD head sample sheet (fastq dirs / slide / area per sample; mode visiumhd).
  snakemake_cell_markers:
    type: string
    description: TSV of canonical marker genes drawn on the Leiden diagnostic plots to guide manual annotation.
  probe_set:
    type: string
    description: Path to the 10x probe-set CSV needed to run Space Ranger (mode visiumhd).
  transcriptome:
    type: string
    description: Path to the Space Ranger reference transcriptome (mode visiumhd).
  spaceranger:
    type: string
    description: Path to the locally installed spaceranger executable

  xenium5k:
    type: ["object", "null"]
    description: Xenium 5K head settings (used only when mode == "xenium5k").
    properties:
      xenium_dir:
        type: string
        description: "{sample} pattern to each Xenium output bundle."
      zarr_dir:
        type: string
        description: Where {sample}.zarr stores are written ("" → spaceranger_processing_outdir).
      qupath_pyramid_level:
        type: integer
        minimum: 0
        description: Pyramid level of the morphology image used for the QuPath composite TIFF.
        default: 3
      hires_pyramid_level:
        type: integer
        minimum: 0
        description: Pyramid level embedded as the uns['spatial'] background image.
        default: 3
      pixel_size_um:
        type: number
        exclusiveMinimum: 0

        description: Xenium pixel size in microns.
        default: 0.2125

  atera:
    type: ["object", "null"]
    description: >
      Atera head settings (used only when mode == "atera"). ALPHA support — validated
      against the 10x WTA preview bundle, whose format is not final.
    properties:
      atera_dir:
        type: string
        description: "{sample} pattern to each Atera outs/ bundle."
      zarr_dir:
        type: string
        description: Where {sample}.zarr stores are written ("" -> spaceranger_processing_outdir).
      qupath_pyramid_level:
        type: integer
        minimum: 0
        description: Pyramid level of the morphology image used for the QuPath composite TIFF.
        default: 3
      hires_pyramid_level:
        type: integer
        minimum: 0
        description: >
          Pyramid level embedded as the uns["spatial"] background image. Also the grid
          the registered H&E background is resampled onto, when one is configured.
        default: 3
      pixel_size_um:
        type: number
        exclusiveMinimum: 0
        description: Microns per full-resolution morphology pixel (experiment.xenium pixel_size).
        default: 0.2125
      he_image:
        type: string
        description: >
          OPTIONAL absolute {sample} pattern to the registered H&E OME-TIFF, which ships
          separately from the outs/ bundle. When set together with he_alignment, a second
          QuPath image is produced, region annotations may be drawn on either image, and
          the H&E becomes the embedded contract background.
      he_alignment:
        type: string
        description: >
          OPTIONAL absolute {sample} pattern to the 10x 3x3 he_alignment.csv mapping
          full-resolution H&E pixels onto full-resolution morphology pixels. Required
          whenever he_image is set.
      he_keypoints:
        type: string
        description: >
          OPTIONAL absolute {sample} pattern to the 10x keypoints.csv. Not required, but
          without it the H&E transform is applied unverified.
      he_pyramid_level:
        type: integer
        minimum: 0
        description: Pyramid level of the H&E read for the QuPath TIFF and the background warp.
        default: 4
      he_residual_warn_px:
        type: number
        exclusiveMinimum: 0
        description: >
          Warn when the largest keypoint residual exceeds this many morphology pixels —
          the tripwire for a changed alignment convention.
        default: 50

  merscope:
    type: ["object", "null"]
    description: MERSCOPE (Vizgen MERFISH) head settings (used only when mode == "merscope").
    properties:
      merscope_dir:
        type: string
        description: "{sample} pattern to each MERSCOPE region directory (holds the two Vizgen CSVs and the images/ folder)."
      z_index:
        type: integer
        minimum: 0
        description: Mosaic z-plane used for the QuPath composite and embedded background (DAPI/PolyT always present).
        default: 3
      hires_pixel_size_um:
        type: number
        exclusiveMinimum: 0
        description: Target microns-per-pixel of the downsampled background embedded in uns["spatial"] and annotated in QuPath.
        default: 1.0
      channels:
        type: array
        items:
          type: string
        description: Mosaic stains to composite, in order; channels absent on disk are skipped (default DAPI, PolyT, Cellbound1-3).

  cluster_annotations:
    type: string
    description: >
      Optional path to a TSV with cluster-to-cell-type annotations.
      Rows are cluster numbers, columns are sample names, values are
      cell-type labels.  If missing or empty, DE and neighbourhood
      analyses are skipped.

  per_sample_qc:
    type: string
    description: >
      Optional path to a TSV of per-sample QC filtering thresholds for
      preprocess_umap.  First column = sample name; remaining columns any of
      min_counts, min_genes, min_cells, max_counts, max_pct_mt.  Present values
      override the analysis.* defaults per sample, key-by-key; missing
      samples/columns fall back to config.  Empty string disables overrides.

  mode:
    type: string
    enum: ["visiumhd", "xenium5k", "atera", "merscope", "decoupled"]
    default: "visiumhd"
    description: >
      A HEAD technology name (that head builds the contract h5ads in this run) or
      "decoupled" (the core consumes pre-existing contracts from contract_dir; head
      rules skipped; validation aborts if any core_samples sample is missing its
      contract). Extend the enum as new heads are added (e.g. xenium5k). "atera" is
      ALPHA support: the platform ships in H2 2026 and the public data is a preview
      whose output format 10x state will change at commercial release.

  core_samples:
    type: string
    description: >
      Optional path to the CORE sample sheet (TSV; required column `sample` plus
      optional experimental-design columns). Authoritative sample list for the
      core; empty = derive from the head visiumhd_samples.csv. The `sample` value need not
      match obs["sample"] in the h5ad (samples may be renamed during preparation).

  contract_dir:
    type: string
    description: >
      Directory the core reads contract h5ads from. Empty = the per-sample output
      tree. In decoupled mode, set to the head's output location.

  sample_colors:
    type: ["object", "null"]
    description: >
      Optional colour palettes for core-sheet columns: column -> {value -> hex}.
    additionalProperties:
      type: object
      additionalProperties:
        type: string

  integration:
    type: ["object", "null"]
    description: Integration settings for integrate_samples.
    properties:
      integrate_key:
        type: string
        description: obs column Harmony corrects on ("sample" = per-sample).

  extra_annotations:
    type: ["object", "null"]
    description: >
      core_samples.tsv columns to surface downstream as UMAP colourings, pseudobulk
      QC panels, and DE heatmap annotation tracks. Annotation-only (no DESeq2 covariate).
    properties:
      columns:
        type: array
        items:
          type: string
        description: Columns to plot/annotate ([] = all non-sample columns).

  geojson_path:
    type: string
    description: Directory of per-sample QuPath region-annotation GeoJSONs.
  spaceranger_processing_outdir:
    type: string
    description: Directory where the head writes heavy intermediates (Space Ranger tree / SpatialData zarr).
  post_processing_outdir:
    type: string
    description: Analysis output root; holds the result folders for the run.
  logdir:
    type: string

    description: Directory for per-rule logs and benchmarks.
  analysis:
    type: object
    properties:
      min_counts:
        type: integer
        minimum: 1
        default: 1
        description: Minimum total counts per cell (QC filter).
      min_cells:
        type: integer
        minimum: 1
        default: 3
        description: Minimum number of cells a gene must be detected in (QC filter).
      min_genes:
        type: integer
        minimum: 1
        default: 100
        description: Minimum number of genes per cell (QC filter).
      max_counts:
        type: integer
        minimum: 1
        description: Optional upper bound on total counts per cell (omit to disable).
      max_pct_mt:
        type: number
        minimum: 0
        maximum: 100
        description: Optional upper bound on percent mitochondrial counts (omit to disable).
      n_top_genes:
        type: integer
        minimum: 100
        default: 5000
        description: Number of highly variable genes to select.
      n_neighbors:
        type: integer
        minimum: 2
        default: 10
        description: Number of neighbours for the kNN graph.
      n_pcs:
        type: integer
        minimum: 2
        default: 30
        description: Number of principal components used to build the neighbours graph.
      leiden_resolution:
        type: number
        exclusiveMinimum: 0
        default: 0.6
        description: Single Leiden resolution used when not scanning a range.
      resolution_scan_min:
        type: number
        exclusiveMinimum: 0
        default: 0.8
        description: Lowest Leiden resolution in the multi-resolution scan.
      resolution_scan_max:
        type: number
        exclusiveMinimum: 0
        default: 1.2
        description: Highest Leiden resolution in the multi-resolution scan.
      resolution_scan_step:
        type: number
        exclusiveMinimum: 0
        default: 0.2
        description: Step between Leiden resolutions in the scan.
      de_n_genes:
        type: integer
        minimum: 1
        default: 10
        description: Number of top differential-expression marker genes reported per group.
      run_pseudobulk_de:
        type: boolean
        default: false
        description: Gate the optional R/DESeq2 pseudobulk_de step.
      run_leiden_analysis:
        type: boolean
        default: true
        description: >
          Produce the per-resolution Leiden diagnostic plots. Optional (clustering
          itself happens in preprocess_umap); set false to skip, e.g. when overlaying
          external annotation.
      analysis_levels:
        type: array
        items:
          type: string
        description: Pseudobulk analysis levels (e.g. by_region, by_celltype_region).
      region_levels:
        type: array
        items:
          type: string
        description: Ordered region names (must match region_annotation values in the data).
      region_colors:
        type: object
        additionalProperties:
          type: string
        description: region name -> hex colour.
      plot_dpi:
        type: integer
        minimum: 1
        description: Default figure DPI.

  ingest_ref:
    type: string
    description: >
      Optional reference h5ad for scanpy label transfer (ingest_ref rule) and the
      qc_sweep cell-type overlay. Empty string disables ingest.

  ingest_ref_label_key:
    type: string
    description: obs column in the ingest reference holding the cell-type label.

  annotation_types:
    type: array
    items:
      type: string
    description: >
      Annotation types analysed downstream (neighbourhood, pseudobulk). Defaults to
      ["tsv_annotation"] when omitted.

  random_seed:
    type: integer
    description: Global RNG seed.

  use_precomputed_clusters:
    type: boolean
    description: Reuse precomputed cluster metadata when available.

  precomputed_metadata_dir:
    type: string
    description: Directory of precomputed metadata_{sample}.tsv (with use_precomputed_clusters).

  external_annotation:
    type: ["object", "null"]
    description: Optional external cell-type annotation source.
    properties:
      enabled:
        type: boolean
        description: Enable overlaying external cell-type labels.
        default: false
      column:
        type: string
        description: obs/metadata column holding the external label.
      keep_unannotated:
        type: boolean
        default: true
        description: >
          false → keep only externally-annotated cells and skip pipeline QC (external
          labels drive QC); true → normal QC, labels overlaid at annotation.

  contract:
    type: ["object", "null"]
    description: >
      Semantic HEAD->CORE contract keys. `unfiltered_h5ad` and `outdir` are injected by
      the Snakefile after validation and are intentionally not defined here.
    properties:
      sample_key:
        type: string
        description: obs column holding the sample id.
        default: sample
      spatial_key:
        type: string
        description: obsm key holding the spatial coordinates.
        default: spatial
      require_region:
        type: boolean
        description: If true, a missing region_annotation is a hard validation failure.
        default: false
      require_raw_counts:
        type: boolean
        description: If true, validate that X holds non-negative integer raw counts.
        default: true
      mito_prefix:
        type: array
        items:
          type: string

        description: Gene-name prefixes used to flag mitochondrial genes.
  qc_sweep:
    type: ["object", "null"]
    description: OPTIONAL pre-filtering QC diagnostic (target qc_sweep_all).
    properties:
      ingest_enabled:
        type: boolean
        description: Overlay ingest-reference cell types on the QC-sweep plots.
        default: false
      dpi:
        type: integer
        minimum: 1
        description: Figure resolution (DPI) for the QC-sweep plots.
        default: 300
      thresholds:
        type: object
        description: Candidate cut-off LISTS per feature (min_genes/min_counts/max_counts/max_pct_mt).
        additionalProperties:
          type: array
          items:
            type: number
      ingest_key:
        type: string
        description: (Legacy; unused — qc_sweep reuses the top-level ingest_ref.)
      cell_id_key:
        type: string
        description: (Legacy; unused.)

  annotation_colors:
    type: ["object", "null"]
    description: Cell-type colour palettes — annotation column -> {value -> hex}.
    additionalProperties:
      type: object
      additionalProperties:
        type: string

  gene_exploration:
    type: ["object", "null"]
    description: Gene/signature exploration settings (target explore_genes).
    properties:
      queries:
        type: string
        description: TSV of genes / gene sets to score (AUCell) and plot.
      annot_key:
        type: string
        description: Annotation column used to colour the exploration plots.
      niche_column:
        type: string
        description: obs column holding the spatial-niche label.
      aucell_max_rank_fraction:
        type: number
        description: AUCell max rank, as a fraction of the ranked genes.
      dpi:
        type: integer
        minimum: 1

        description: Figure resolution (DPI) for the exploration plots.
        default: 300
  spatial_niches:
    type: ["object", "null"]
    description: OPTIONAL cross-sample spatial-niche identification.
    properties:
      enabled:
        type: boolean
        description: Enable BANKSY spatial-niche detection.
        default: false
      use_precomputed:
        type: boolean
        description: Reuse precomputed niche assignments from niche_dir instead of recomputing.
      niche_dir:
        type: string

        description: Directory of precomputed per-sample niche TSVs.
  subcompartments:
    type: ["object", "null"]
    description: >
      Subcompartment definitions for the subcluster rule (name -> settings). Keys are
      the subcompartment names; each needs a non-empty `strings` list of cell types.
    additionalProperties:
      type: object
      required:
      - strings
      properties:
        strings:
          type: array
          items:
            type: string
          minItems: 1
          description: Cell-type labels that make up this subcompartment.
        resolution_min:
          type: number
          exclusiveMinimum: 0
          description: Lowest Leiden resolution when re-clustering this subcompartment.
        resolution_max:
          type: number
          exclusiveMinimum: 0
          description: Highest Leiden resolution when re-clustering this subcompartment.
        resolution_step:
          type: number
          exclusiveMinimum: 0

          description: Step between Leiden resolutions for this subcompartment.
  resources:
    type: object
    required:
    - spaceranger_count_vhd
    - preprocess_umap
    - leiden_analysis
    - default
    additionalProperties:
      type: object
      required:
      - mem_mb
      - runtime
      - threads
      properties:
        mem_mb:
          type: integer
          minimum: 1024
          description: Memory request in MB (scaled by the retry attempt).
        runtime:
          type: integer
          minimum: 1
          description: Wall-clock limit in minutes.
        threads:
          type: integer
          minimum: 1
          description: Number of CPU threads.
allOf:
- if:
    properties:
      mode:
        const: visiumhd
  then:
    required:
    - samples
    - probe_set
    - transcriptome
    - spaceranger
- if:
    properties:
      mode:
        const: xenium5k
    required:
    - mode
  then:
    required:
    - xenium5k
- if:
    properties:
      mode:
        const: merscope
    required:
    - mode
  then:
    required:
    - merscope
