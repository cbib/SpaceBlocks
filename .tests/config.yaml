samples: "config/samples.csv"
snakemake_cell_markers: "config/snakemake_cell_markers.tsv"
probe_set: "/tmp/test_probe_set.csv"
transcriptome: "/tmp/test_transcriptome"
spaceranger: "/tmp/test_spaceranger"
geojson_path: "/tmp/test_geojson"
cluster_annotations: ""
spaceranger_processing_outdir: "/tmp/test_sr_output"
post_processing_outdir: "/tmp/test_pp_output"
logdir: "/tmp/test_logs"

analysis:
  min_counts: 1
  min_cells: 3
  min_genes: 100
  n_top_genes: 5000
