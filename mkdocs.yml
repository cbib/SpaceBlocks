site_name: SpaceBlocks
site_description: A Snakemake workflow for single-cell-resolution spatial transcriptomics
repo_url: https://github.com/<owner>/SpaceBlocks
repo_name: <owner>/SpaceBlocks
edit_uri: edit/main/docs/

theme:
  name: material
  icon:
    repo: fontawesome/brands/github
  palette:
    - scheme: default
      primary: teal
      accent: teal
      toggle: { icon: material/weather-night, name: Switch to dark mode }
    - scheme: slate
      primary: teal
      accent: teal
      toggle: { icon: material/weather-sunny, name: Switch to light mode }
  features:
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - search.suggest
    - search.highlight
    - content.code.copy
    - toc.follow

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.snippets:            # lets docs pages include repo-root files (single source)
      base_path: ["."]
      check_paths: true
  - toc:
      permalink: true
      # GitHub-compatible heading slugs, so TOC anchors written for GitHub (e.g. the
      # em-dash "Coreblock 1 — preprocessing") resolve identically on the rendered site.
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower

plugins:
  - search

nav:
  - Home: index.md
  - Get started: getting-started.md
  - Design & architecture: design.md
  - Outputs: outputs.md
  - Rule reference: rules.md
  - Configuration: configuration.md
  - QuPath annotation: qupath-tutorial.md
  - Environments: environments.md
  - Reproduce & examples: reproduction.md
