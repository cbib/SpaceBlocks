# CI smoke-test config (mode: decoupled). Tiny synthetic contracts in ../data.
mode: decoupled
post_processing_outdir: .tests/integration/output
logdir: .tests/integration/logs
spaceranger_processing_outdir: .tests/integration/sr
geojson_path: .tests/integration/geojson
contract_dir: .tests/integration/data
random_seed: 0
use_precomputed_clusters: false
precomputed_metadata_dir: ''
core_samples: .tests/integration/config/core_samples.tsv
xenium5k:
  xenium_dir: /scratch/CBiB/soterino/xenium/{sample}
  zarr_dir: ''
  qupath_pyramid_level: 3
  hires_pyramid_level: 3
  pixel_size_um: 0.2125
contract:
  sample_key: sample
  spatial_key: spatial
  require_region: false
  require_raw_counts: true
  mito_prefix:
  - MT-
  - mt-
preprocess_thresholds: ''
analysis:
  plot_dpi: 300
  min_counts: 1
  min_cells: 3
  min_genes: 100
  n_neighbors: 10
  n_pcs: 30
  de_n_genes: 25
  resolution_scan_min: 0.6
  resolution_scan_max: 0.8
  resolution_scan_step: 0.2
  min_cells_per_type: 15
  sketch_fraction: 0.25
  run_pseudobulk_de: true
  run_leiden_analysis: true
  analysis_levels:
  - by_region
  - by_celltype_region
  min_cells_per_pseudobulk: 10
  min_replicates: 3
  min_counts_per_pseudobulk: 1000
  padj_threshold: 0.05
  lfc_threshold: 0.25
  region_levels:
  - Healthy area
  - Healthy over tumor
  - Dysplastic area
  - AK area
  - AK over tumor
  - In situ area
  - Tumor area
  - Invasive area
  region_colors:
    Healthy area: '#FDE725FF'
    Healthy over tumor: '#9FDA3AFF'
    Dysplastic area: '#4AC16DFF'
    AK area: '#1FA187FF'
    AK over tumor: '#277F8EFF'
    In situ area: '#365C8DFF'
    Tumor area: '#46337EFF'
    Invasive area: '#440154FF'
qc_sweep:
  ingest_enabled: false
  ingest_key: cell_type_ingest
  cell_id_key: cell_id
  dpi: 300
  thresholds:
    min_genes:
    - 50
    - 100
    - 200
    min_counts:
    - 1
    - 10
    - 50
    max_counts:
    - 3000
    - 5000
    max_pct_mt:
    - 10
    - 15
    - 20
cluster_annotations: .tests/integration/config/cluster_annotations.tsv
snakemake_cell_markers: .tests/integration/config/snakemake_cell_markers.tsv
external_annotation:
  enabled: false
  column: manual_celltype
  keep_unannotated: true
ingest_ref: ''
ingest_ref_label_key: 04_celltypes
integration:
  integrate_key: sample
extra_annotations:
  columns:
  - patient
  - batch
spatial_niches:
  enabled: true
  use_precomputed: false
  niche_dir: ''
  lambda: 0.8
  num_neighbours: 18
  cluster_n_neighbours: 15
  n_iterations: 2
  max_m: 1
  nbr_weight_decay: scaled_gaussian
  use_hvg: true
  n_top_genes: 2000
  niche_resolution: 0.3
  refine: false
  refine_num_neigh: 6
  refine_iterations: 1
  refine_auto: false
  compute_umap: false
subcompartments: {}
gene_exploration:
  queries: .tests/integration/config/gene_queries.tsv
  aucell_max_rank_fraction: 0.05
  niche_column: spatial_niche
  dpi: 300
