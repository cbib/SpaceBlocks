transcriptome: "/mnt/cbib/bank/cellranger/refdata-gex-GRCh38-2024-A"

ingest_ref: "/scratch/CBiB/soterino/ingest_ref_data/bcc_and_normal_Garnier_PNAS_2024.h5ad"
ingest_ref_label_key: "04_celltypes"   # obs column in the reference

cluster_annotations: "config/cluster_annotations.tsv"
annotation_markers: "config/annotation_markers.tsv"

spaceranger: "/home/soterinosogo/spaceranger-4.0.1/spaceranger"

geojson_path: "/scratch/CBiB/soterino/geojson"

spaceranger_processing_outdir: "/scratch/CBiB/soterino/smk_spaceranger_results"
post_processing_outdir: "/scratch/CBiB/soterino/smk_visiumhd_results"

logdir: "/scratch/CBiB/soterino/smk_logs"

analysis:
  min_counts: 1
  min_cells: 3
  min_genes: 100
  n_neighbors: 10
  n_pcs: 30
  de_n_genes: 10
  resolution_scan_min: 0.6
  resolution_scan_max: 0.8            # inclusive upper bound (values > 1.0 are valid)
  resolution_scan_step: 0.2
  # Annotation refinement
  marker_refinement_threshold: 0.5   # normalised expression cutoff
  min_markers_expressed: 2
  min_cells_per_type: 15
  # Integration
  sketch_fraction: 0.25              # fraction of cells for geosketch
  # Pseudobulk
  min_cells_per_pseudobulk: 10   # minimum cells to form a pseudobulk sample
  min_replicates: 3              # minimum samples per condition for DE
  de_n_genes: 25                 # number of DE genes to plot
  min_counts_per_pseudobulk: 1000
  padj_threshold: 0.05
  lfc_threshold: 0.25

