  - anndata>=0.10
  - scanpy>=1.10
  - numpy>=1.24,<2
  - scipy>=1.10
  - pandas>=2.0
  # ── Plotting ───────────────────────────────────────────────────────
  - matplotlib-base>=3.7
  - seaborn>=0.13
  # ── I/O ────────────────────────────────────────────────────────────
  - h5py>=3.8
  - pyarrow>=14.0
