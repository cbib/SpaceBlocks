# Canonical Catalog/CI fixture (mode: decoupled). Paths are relative to the
# repository root; users should copy config/config.yaml.template over this file.
mode: decoupled
base_dir: .test/test_output
post_processing_outdir: "{base_dir}/output"
logdir: "{base_dir}/logs"
spaceranger_processing_outdir: "{base_dir}/sr"
geojson_path: "{base_dir}/geojson"
contract_dir: ".test/data"
random_seed: 0
use_precomputed_clusters: false
precomputed_metadata_dir: ''
core_samples: .test/config/core_samples.tsv
xenium5k:
  xenium_dir: "{base_dir}/xenium/{sample}"
  qupath_pyramid_level: 3
  hires_pyramid_level: 3
  pixel_size_um: 0.2125
contract:
  sample_key: sample
  spatial_key: spatial
  require_region: false
  require_raw_counts: true
  mito_prefix:
    - MT-
    - mt-
per_sample_qc: ''
analysis:
  plot_dpi: 300
  umap_point_size: 2
  spatial_point_size: 20
  min_counts: 1
  min_cells: 3
  min_genes: 100
  n_neighbors: 10
  n_pcs: 30
  de_n_genes: 25
  resolution_scan_min: 0.6
  resolution_scan_max: 0.8
  resolution_scan_step: 0.2
  min_cells_per_type: 15
  sketch_fraction: 0.25
  run_pseudobulk_de: true
  run_leiden_analysis: true
  min_cells_per_pseudobulk: 10
  min_replicates: 3
  min_counts_per_pseudobulk: 1000
  padj_threshold: 0.05
  lfc_threshold: 0.25
  pseudobulk:
    analyses:
      - name: regions_all_cells
        aggregation: by_region
        group_by:
          - region_annotation
        paired_by: sample
        exclude_levels:
          region_annotation:
            - Unlabeled
        contrasts:
          - name: tumor_vs_healthy
            numerator:
              region_annotation: Tumor area
            denominator:
              region_annotation: Healthy area
        lrt:
          enabled: true
      - name: regions_by_celltype
        aggregation: by_celltype_region
        group_by:
          - region_annotation
        paired_by: sample
        exclude_levels:
          region_annotation:
            - Unlabeled
          cell_type:
            - Unannotated
        contrasts:
          - name: tumor_vs_healthy
            numerator:
              region_annotation: Tumor area
            denominator:
              region_annotation: Healthy area
        lrt:
          enabled: true
  region_levels:
    - Healthy area
    - Premalignant area
    - Tumor area
  region_colors:
    Healthy area: '#FDE725FF'
    Premalignant area: '#1FA187FF'
    Tumor area: '#46337EFF'
qc_sweep:
  ingest_enabled: false
  ingest_key: cell_type_ingest
  cell_id_key: cell_id
  dpi: 300
  thresholds:
    min_genes:
      - 50
      - 100
      - 200
    min_counts:
      - 1
      - 10
      - 50
    max_counts:
      - 3000
      - 5000
    max_pct_mt:
      - 10
      - 15
      - 20
cluster_annotations: .test/config/cluster_annotations.tsv
snakemake_cell_markers: .test/config/snakemake_cell_markers.tsv
external_annotation:
  enabled: false
  column: manual_celltype
  keep_unannotated: true
ingest_ref: ''
ingest_ref_label_key: cell_type_annotation_column
integration:
  integrate_key: sample
extra_annotations:
  columns:
    - patient
    - batch
spatial_niches:
  enabled: true
  use_precomputed: false
  niche_dir: ''
  lambda: 0.8
  num_neighbours: 18
  cluster_n_neighbours: 50
  n_iterations: -1
  max_m: 1
  nbr_weight_decay: scaled_gaussian
  use_hvg: true
  n_top_genes: 2000
  niche_resolution: 0.1
  refine: false
  refine_num_neigh: 6
  refine_iterations: 1
  refine_auto: false
  compute_umap: false
subcompartments:
  Keratinocytes:
    strings:
      - Keratinocytes
    resolution_min: 0.6
    resolution_max: 0.8
    resolution_step: 0.2
gene_exploration:
  queries: .test/config/gene_queries.tsv
  aucell_max_rank_fraction: 0.05
  niche_column: spatial_niche
  dpi: 300
sample_colors:
  patient:
    Patient 1: '#000000'
    Patient 2: '#E69F00'
  batch:
    Batch 1: '#8E44AD'
annotation_colors:
  cell_type_tsv:
    Keratinocytes: '#d62728'
    Tcells: '#1f77b4'
    Fibroblasts: '#2ca02c'
  cell_type_external:
    Keratinocytes: '#d62728'
    Tcells: '#1f77b4'
    Fibroblasts: '#2ca02c'
