name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  lint-and-dryrun:
    # Fast smoke test: lints the workflow and builds the full DAG on a tiny synthetic
    # decoupled dataset (.tests/integration). No Conda envs or Space Ranger needed — a
    # dry-run validates the graph and (via the Snakefile) the config against the schema.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install snakemake pandas jsonschema
      - name: Lint
        # Pin to the committed .tests fixture so editing the shipped default config
        # (or an example config pointing at generated paths) cannot break CI.
        run: snakemake --lint --configfile .tests/integration/config/config.yaml --workflow-profile none
      - name: Dry-run (decoupled smoke test)
        run: snakemake --configfile .tests/integration/config/config.yaml -n --workflow-profile none
