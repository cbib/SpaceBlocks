# SpaceBlocks configuration.  Full explanations: config/README.md (or the online docs).
# Every key is validated against workflow/schemas/config.schema.yaml before the run starts.

# ─── Run mode — which headblock builds the contract h5ad ─────────────────────
mode: visiumhd

# ─── I/O directories ─────────────────────────────────────────────────────────
post_processing_outdir: /scratch/CBiB/soterino/smk_visiumhd_results
logdir: /scratch/CBiB/soterino/smk_logs
spaceranger_processing_outdir: /scratch/CBiB/soterino/smk_spaceranger_results
geojson_path: /scratch/CBiB/soterino/geojson # QuPath region GeoJSONs (optional, recommended)
contract_dir: '' # mode: decoupled — dir of pre-built contract h5ads

# ─── Reproducibility & reuse   (docs → Configuration §6) ─────────────────────
random_seed: 0
use_precomputed_clusters: true # reuse clusters from precomputed_metadata_dir
precomputed_metadata_dir: /scratch/CBiB/soterino/metadata_visiumhd/

# ─── Sample sheets ───────────────────────────────────────────────────────────
core_samples: config/core_samples.tsv
samples: config/visiumhd_samples.csv # mode: visiumhd — fastq/slide/area per sample

# ─── Visium HD head   (mode: visiumhd) ───────────────────────────────────────
spaceranger: /home/soterinosogo/spaceranger-4.0.1/spaceranger # external install; path to the executable
probe_set: /scratch/CBiB/soterino/Visium_Human_Transcriptome_Probe_Set_v2.1.0_GRCh38-2024-A.csv
transcriptome: /mnt/cbib/bank/cellranger/refdata-gex-GRCh38-2024-A

# ─── Xenium 5K head   (mode: xenium5k) ───────────────────────────────────────
xenium5k:
  xenium_dir: /scratch/CBiB/soterino/xenium/{sample}
  zarr_dir: ''
  qupath_pyramid_level: 3
  hires_pyramid_level: 3
  pixel_size_um: 0.2125

# ─── Contract — Head → Core hand-off ─────────────────────────────────────────
contract:
  sample_key: sample
  spatial_key: spatial
  require_region: false
  require_raw_counts: true
  mito_prefix:
    - MT-
    - mt-

# ─── QC & preprocessing ──────────────────────────────────────────────────────
per_sample_qc: '' # optional per-sample QC TSV; empty = global analysis.* thresholds
analysis:
  plot_dpi: 300
  min_counts: 1
  min_cells: 3
  min_genes: 100
  n_neighbors: 10
  n_pcs: 30
  de_n_genes: 25
  resolution_scan_min: 0.6
  resolution_scan_max: 0.8
  resolution_scan_step: 0.2
  min_cells_per_type: 15
  sketch_fraction: 0.25
  run_pseudobulk_de: true
  run_leiden_analysis: true
  analysis_levels:                  # by_niche_region also available; off by default (many groups)
    - by_region
    - by_celltype_region
  min_cells_per_pseudobulk: 10
  min_replicates: 3
  min_counts_per_pseudobulk: 1000
  padj_threshold: 0.05
  lfc_threshold: 0.25
  region_levels:
    - Healthy area
    - Healthy over tumor
    - Dysplastic area
    - AK area
    - AK over tumor
    - In situ area
    - Tumor area
    - Invasive area
  region_colors:                    # keys must match region_levels above
    Healthy area: '#FDE725FF'
    Healthy over tumor: '#9FDA3AFF'
    Dysplastic area: '#4AC16DFF'
    AK area: '#1FA187FF'
    AK over tumor: '#277F8EFF'
    In situ area: '#365C8DFF'
    Tumor area: '#46337EFF'
    Invasive area: '#440154FF'
qc_sweep:
  ingest_enabled: true
  ingest_key: cell_type_ingest
  cell_id_key: cell_id
  dpi: 300
  thresholds:
    min_genes:
      - 50
      - 100
      - 200
    min_counts:
      - 1
      - 10
      - 50
    max_counts:
      - 3000
      - 5000
    max_pct_mt:
      - 10
      - 15
      - 20

# ─── Annotation ──────────────────────────────────────────────────────────────
cluster_annotations: config/cluster_annotations.tsv  # cluster → cell-type TSV (from generate_annotation_template)
snakemake_cell_markers: config/snakemake_cell_markers.tsv # markers drawn on the Leiden diagnostic plots
external_annotation:
  enabled: false
  column: manual_celltype
  keep_unannotated: true
ingest_ref: /scratch/CBiB/soterino/ingest_ref_data/bcc_and_normal_Garnier_PNAS_2024.h5ad  # optional annotated scRNA-seq reference (ingest_ref)
ingest_ref_label_key: 04_celltypes
integration:
  integrate_key: sample
extra_annotations:
  columns:
    - patient
    - batch

# ─── Spatial niches   (optional) ─────────────────────────────────────────────
spatial_niches:
  enabled: true
  use_precomputed: true
  niche_dir: /scratch/CBiB/soterino/niches_visiumhd/
  lambda: 0.8
  num_neighbours: 18
  cluster_n_neighbours: 15
  n_iterations: 2
  max_m: 1
  nbr_weight_decay: scaled_gaussian
  use_hvg: true
  n_top_genes: 2000
  niche_resolution: 0.3
  refine: false
  refine_num_neigh: 6
  refine_iterations: 1
  refine_auto: false
  compute_umap: false

# ─── Subcompartments   (optional) ────────────────────────────────────────────
subcompartments:
  Fibroblasts:
    strings:
      - Fibroblasts
      - Fibroblasts_Macro
      - Fibroblasts_Endothelial
      - Fibroblasts_Keratinocytes
      - Fibroblasts_Plasma
    resolution_min: 0.6
    resolution_max: 1.2
    resolution_step: 0.2
  Keratinocytes:
    strings:
      - Keratinocytes
      - Keratinocytes_Mal
      - Keratinocytes_Basal
      - Keratinocytes_Suprabasal
      - Fibroblasts_Keratinocytes
    resolution_min: 0.6
    resolution_max: 1.2
    resolution_step: 0.2
  MonoMacro_Tcells:
    strings:
      - Mono_Macro
      - Macro_Tcells
      - Macro_Plasma
      - Tcells
      - Fibroblasts_Macro
    resolution_min: 0.6
    resolution_max: 1.2
    resolution_step: 0.2
  Plasma_Bcells:
    strings:
      - Plasma_cells
      - Macro_Plasma
      - Fibroblasts_Plasma
    resolution_min: 0.6
    resolution_max: 1.2
    resolution_step: 0.2

# ─── Gene / signature exploration ────────────────────────────────────────────
gene_exploration:
  queries: config/gene_queries.tsv
  aucell_max_rank_fraction: 0.05
  niche_column: spatial_niche
  dpi: 300

