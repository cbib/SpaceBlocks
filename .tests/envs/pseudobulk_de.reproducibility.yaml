# pseudobulk_de — FIXED test environment (SpaceBlocks .tests/).
# conda deps pinned to the exact versions in envs/pseudobulk_de_linux-64.lock so the
# release test is reproducible regardless of when it is run. pip deps cannot be
# read from a conda lock — pin them from `pip freeze` in the tested env for a
# fully-fixed test (or install from the committed .lock directly).
name: pseudobulk_de
channels:
  - conda-forge
  - bioconda
dependencies:
  - r-base=4.5.3
  - r-tidyverse=2.0.0
  - r-rcolorbrewer=1.1_3
  - r-ggrepel=0.9.8
  - bioconductor-deseq2=1.50.2
  - bioconductor-degreport=1.46.0
  - bioconductor-summarizedexperiment=1.40.0
  - bioconductor-complexheatmap=2.26.1
  - r-circlize=0.4.18
