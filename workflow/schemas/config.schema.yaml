$schema: "https://json-schema.org/draft/2020-12/schema"
description: Configuration schema for the Visium HD Snakemake pipeline
type: object

required:
  - samples
  - snakemake_cell_markers
  - probe_set
  - transcriptome
  - spaceranger
  - geojson_path
  - spaceranger_processing_outdir
  - post_processing_outdir
  - logdir
  - resources

properties:
  samples:
    type: string
  snakemake_cell_markers:
    type: string
  probe_set:
    type: string
  transcriptome:
    type: string
  spaceranger:
    type: string
    description: Path to the locally installed spaceranger executable

  cluster_annotations:
    type: string
    description: >
      Optional path to a TSV with cluster-to-cell-type annotations.
      Rows are cluster numbers, columns are sample names, values are
      cell-type labels.  If missing or empty, DE and neighbourhood
      analyses are skipped.

  preprocess_thresholds:
    type: string
    description: >
      Optional path to a TSV of per-sample QC filtering thresholds for
      preprocess_umap.  First column = sample name; remaining columns any of
      min_counts, min_genes, min_cells, max_counts, max_pct_mt.  Present values
      override the analysis.* defaults per sample, key-by-key; missing
      samples/columns fall back to config.  Empty string disables overrides.

  geojson_path:
    type: string
  spaceranger_processing_outdir:
    type: string
  post_processing_outdir:
    type: string
  logdir:
    type: string

  analysis:
    type: object
    properties:
      min_counts:
        type: integer
        minimum: 1
        default: 1
      min_cells:
        type: integer
        minimum: 1
        default: 3
      min_genes:
        type: integer
        minimum: 1
        default: 100
      max_counts:
        type: integer
        minimum: 1
        description: Optional upper bound on total counts per cell (omit to disable).
      max_pct_mt:
        type: number
        minimum: 0
        maximum: 100
        description: Optional upper bound on percent mitochondrial counts (omit to disable).
      n_top_genes:
        type: integer
        minimum: 100
        default: 5000
      n_neighbors:
        type: integer
        minimum: 2
        default: 10
      n_pcs:
        type: integer
        minimum: 2
        default: 30
      leiden_resolution:
        type: number
        exclusiveMinimum: 0
        default: 0.6
      resolution_scan_min:
        type: number
        exclusiveMinimum: 0
        default: 0.2
      resolution_scan_max:
        type: number
        exclusiveMinimum: 0
        default: 0.8
      resolution_scan_step:
        type: number
        exclusiveMinimum: 0
        default: 0.1
      de_n_genes:
        type: integer
        minimum: 1
        default: 10

  resources:
    type: object
    required:
      - spaceranger_count
      - preprocess_umap
      - leiden_analysis
      - default
    additionalProperties:
      type: object
      required:
        - mem_mb
        - runtime
        - threads
      properties:
        mem_mb:
          type: integer
          minimum: 1024
        runtime:
          type: integer
          minimum: 1
        threads:
          type: integer
          minimum: 1
