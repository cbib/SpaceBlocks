    threads: 4
  neighbourhood_analysis:
    mem_mb: 8000
    runtime: 60
    threads: 4
  annotate_cells:
    mem_mb: 8000
    runtime: 60
    threads: 4
  integrate_samples:
    mem_mb: 8000
    runtime: 60
    threads: 4
  spatial_niches:
    mem_mb: 8000
