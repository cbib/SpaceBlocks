  post_processing:
    mem_mb: 4096
    runtime: 10
    threads: 2
  pseudobulk_de:
    mem_mb: 4096
    runtime: 10
    threads: 2
  neighbourhood_analysis:
    mem_mb: 4096
    runtime: 10
    threads: 2
  default:
    mem_mb: 2048
    runtime: 5
    threads: 1
